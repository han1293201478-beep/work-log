<script>
    // --- 配置区 ---
    const CONFIG = {
        URL: 'https://morkovixfwdsaknmwavj.supabase.co',
        KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vcmtvdml4Zndkc2Frbm13YXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3MzM1NDIsImV4cCI6MjA3OTMwOTU0Mn0.wh-UEaQyr3bpJBQkCrzJpRR5v4NvRpx3LsnsAo-DGqE'
    };
    const db = supabase.createClient(CONFIG.URL, CONFIG.KEY);

    let state = {
        userId: '',
        isEditMode: false,
        paths: JSON.parse(localStorage.getItem('finance_paths') || '["支付宝/余额", "微信/零钱", "银行卡/工资卡"]'),
viewMode: 'path', // 'path' 或 'tag'
    selectedIds: []   // 存储批量选择的 ID
    };

    // --- 加密逻辑 ---
    async function sha256(str) {
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

// --- 手动/独立登录（修复版） ---
async function manualAuth() {
    const id = document.getElementById('user-id-input').value.trim();
    const pwd = document.getElementById('pwd-input').value;
    if (!id || !pwd) return alert("请填写完整信息");

    const hash = await sha256(pwd);

    try {
        // 请求数据
        const { data: dbResult, error } = await db
            .from('settings')
            .select('data')
            .eq('user_id', id);

        if (error) throw error;

        if (dbResult && dbResult.length > 0) {
            const settingsObj = dbResult[0].data;
            // 兼容性提取：如果 data 是对象则取内部 hash，否则直接对比
            const dbHash = (typeof settingsObj === 'object') ? settingsObj.auth_hash : settingsObj;

            if (dbHash === hash) {
                // 登录成功逻辑
                state.userId = id;
                state.isEditMode = true;
                localStorage.setItem('settingUserId', id);
                localStorage.setItem('adminPasswordHash', hash);
                updateUI();
                refreshData();
                alert("🔓 解锁成功：已进入编辑模式");
            } else {
                alert("❌ 密码错误");
            }
        } else {
            alert("❓ 未找到该 ID，请检查输入或 RLS 权限");
        }
    } catch (err) {
        console.error("验证出错:", err);
        alert("系统错误: " + err.message);
    }
}



function logout() {
    if (confirm("确定要退出登录并锁定编辑权限吗？")) {
        // 清理本地存储
        localStorage.removeItem('userId');
        localStorage.removeItem('adminPasswordHash');
        
        // 重置状态
        state.userId = '';
        state.isEditMode = false;
        
        // UI 更新
        document.getElementById('user-id-input').value = '';
        document.getElementById('pwd-input').value = '';
        updateUI();
        refreshData();
    }
}
// --- 自动登录检查（修复版） ---
async function init() {
    // 1. 尝试所有可能的 ID 键名 (兼容主页面的 userId)
    const savedId = localStorage.getItem('userId') || localStorage.getItem('settingUserId');
    // 2. 获取钥匙
    const savedHash = localStorage.getItem('adminPasswordHash');

    console.log("正在尝试自动登录...", { ID: savedId, 有无钥匙: !!savedHash });

    if (savedId) {
        state.userId = savedId;
        document.getElementById('user-id-input').value = savedId;
        
        // 如果有钥匙，去云端验证
        if (savedHash) {
            try {
                const { data: dbResult, error } = await db
                    .from('settings')
                    .select('data')
                    .eq('user_id', savedId);
                
                if (dbResult && dbResult.length > 0) {
                    const settingsObj = dbResult[0].data;
                    // 核心提取：从 data 对象里拿 auth_hash
                    const dbHash = (typeof settingsObj === 'object') ? settingsObj.auth_hash : settingsObj;
                    
                    if (dbHash === savedHash) {
                        state.isEditMode = true;
                        console.log("✅ 自动验证成功，已解锁编辑权限");
                    } else {
                        console.log("❌ 钥匙(Hash)不匹配");
                    }
                }
            } catch (e) {
                console.error("验证过程出错:", e);
            }
        }
    }
    
    // 更新界面和加载数据
    updateUI();
    refreshData();
}

    // --- UI 更新逻辑 ---
    function updateUI() {
        const tag = document.getElementById('auth-status-tag');
        const loginPanel = document.getElementById('login-panel');
        const editPanel = document.getElementById('edit-panel');

        if (state.isEditMode) {
            tag.innerText = "编辑模式";
            tag.className = "status-tag tag-edit";
            loginPanel.style.display = 'none';
            editPanel.style.display = 'block';
        } else {
            tag.innerText = "只读";
            tag.className = "status-tag tag-readonly";
            loginPanel.style.display = 'block';
            editPanel.style.display = 'none';
        }
        renderPathSelector();
    }

    // --- 路径管理 ---
function renderPathSelector() {
    const sel = document.getElementById('path-selector');
    const refSel = document.getElementById('path-ref-selector');
    
    // 生成选项 HTML
    const optionsHtml = state.paths.sort().map(p => `<option value="${p}">${p.replace(/\//g,' > ')}</option>`).join('');
    
    // 更新录入余额的下拉菜单 
    sel.innerHTML = optionsHtml;
    
    // 更新参考编辑的下拉菜单，并保留第一个提示项
    refSel.innerHTML = '<option value="">-- 选择已有路径快速填入 --</option>' + optionsHtml;
}

function fillPathFromRef() {
    const refSel = document.getElementById('path-ref-selector');
    const input = document.getElementById('new-path');
    
    if (refSel.value) {
        input.value = refSel.value; // 将选中的路径填入输入框 
        input.focus(); // 自动聚焦，方便你立即修改 [cite: 62]
    }
}

    function addNewPath() {
        const val = document.getElementById('new-path').value.trim();
        if (val && !state.paths.includes(val)) {
            state.paths.push(val);
            localStorage.setItem('finance_paths', JSON.stringify(state.paths));
            renderPathSelector();
            document.getElementById('new-path').value = '';
        }
    }

async function renamePath() {
    const oldPath = document.getElementById('path-ref-selector').value;
    const newPath = document.getElementById('new-path').value.trim();

    if (!oldPath || !newPath) return alert("请先在下拉框选择旧路径，并在输入框输入新名称");
    if (oldPath === newPath) return alert("新旧名称相同，无需修改");
    if (!state.isEditMode) return alert("请先解锁编辑权限");

    if (!confirm(`确定将“${oldPath}”更名为“${newPath}”吗？\n这将同步更新云端所有历史记录。`)) return;

    try {
        // 1. 更新云端数据库：将所有旧路径记录改为新路径
        const { error: dbError } = await db
            .from('finance_records')
            .update({ category_path: newPath })
            .eq('user_id', state.userId)
            .eq('category_path', oldPath);

        if (dbError) throw dbError;

        // 2. 更新本地路径列表 state.paths
        state.paths = state.paths.map(p => p === oldPath ? newPath : p);
        
        // 3. 移除可能存在的重复项（如果新名称已存在）
        state.paths = [...new Set(state.paths)];

        // 4. 持久化到本地存储
        localStorage.setItem('finance_paths', JSON.stringify(state.paths));

        // 5. 刷新界面
        renderPathSelector();
        document.getElementById('new-path').value = '';
        await refreshData();

async function parseSmartInput() {
// 强制登录拦截
    if (!state.userId) {
        alert("🚨 请先点击上方【开始同步/登录】！不登录数据没法存。");
        return;
    }
    const input = document.getElementById('smart-input').value.trim();
    if (!input) return;

    // 1. 提取金额
    const amtMatch = input.match(/\d+(\.\d+)?/);
    if (!amtMatch) return alert("没找到金额数字");
    const amount = parseFloat(amtMatch[0]);

    // 2. 识别分类 (严格按出现顺序)
    let matched = [];
    state.paths.forEach(p => {
        const name = p.split('/').pop();
        const idx = input.indexOf(name);
        if (idx !== -1) matched.push({ p, idx, name });
    });
    matched.sort((a, b) => a.idx - b.idx);

    // 3. 识别备注
    let remark = "无备注";
    if (input.includes("备注")) {
        remark = input.split("备注").pop().trim();
    }

    const recordDate = new Date().toISOString();
    let records = [];
    const hasReturn = input.includes('还'); // 核心：有没有“还”字

    // --- 判定核心 ---
    if (matched.length >= 2 && hasReturn) {
        // 【模式一：双账户特殊处置】 必须有“还”字
        // 逻辑：第一个名字减，第二个名字加
        records.push({ category_path: matched[0].p, amount: -amount, remark: remark, user_id: state.userId, record_date: recordDate });
        records.push({ category_path: matched[1].p, amount: amount, remark: remark, user_id: state.userId, record_date: recordDate });
    } 
    else if (matched.length >= 1) {
        // 【模式二：单账户或无“还”字的普通识别】
        // 取第一个匹配到的分类为准
        const path = matched[0].p;
        let dir = 0;

        // 严格匹配你给的关键字
        const plusWords = ['赚', '收', '多'];
        const minusWords = ['花', '赔', '少', '还'];

        if (plusWords.some(w => input.includes(w))) dir = 1;
        else if (minusWords.some(w => input.includes(w))) dir = -1;

        if (dir === 0) return alert("请包含关键词：(赚收多) 或 (花赔少还)");
        
        records.push({ category_path: path, amount: amount * dir, remark: remark, user_id: state.userId, record_date: recordDate });
    } else {
        return alert("得带上分类名(如：微信、花呗、滕含)");
    }

    // 4. 执行
    const summary = records.map(r => `${r.category_path.split('/').pop()}: ${r.amount > 0 ? '+' : ''}${r.amount}`).join('\n');
    if (confirm(`解析结果：\n${summary}\n备注：${remark}`)) {
        const { error } = await db.from('finance_records').insert(records);
        if (error) alert("失败: " + error.message);
        else {
            document.getElementById('smart-input').value = '';
            refreshData();
        }
    }
}

async function refreshData() {
    const listContainer = document.getElementById('finance-list-container');
    if (!listContainer) return;

    // 更新视图按钮高亮样式 (保持状态)
    const pathBtn = document.getElementById('btn-view-path');
    const tagBtn = document.getElementById('btn-view-tag');
    if(pathBtn && tagBtn) {
        pathBtn.style.background = state.viewMode === 'path' ? '#444' : 'transparent';
        tagBtn.style.background = state.viewMode === 'tag' ? '#444' : 'transparent';
    }

    listContainer.innerHTML = '<div style="text-align:center; padding:20px;">数据同步中...</div>';

    try {
        const { data: records, error } = await db.from('finance_records')
            .select('*')
            .eq('user_id', state.userId)
            .order('record_date', { ascending: false });

        if (error) throw error;

        // 1. 数据分组逻辑
        const groups = {};
        let totalBalance = 0;
        records.forEach(r => {
            totalBalance += r.amount;
            const groupKey = state.viewMode === 'tag' ? (r.category_tag || '未分类') : (r.category_path || '默认');
            if (!groups[groupKey]) groups[groupKey] = { total: 0, items: [] };
            groups[groupKey].total += r.amount;
            groups[groupKey].items.push(r);
        });

        listContainer.innerHTML = '';

        // 2. 开始渲染分组
        Object.keys(groups).sort().forEach(key => {
            const group = groups[key];
            const groupCard = document.createElement('div');
            groupCard.style.cssText = "background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px; padding:15px; margin-bottom:15px;";
            
            // 分组标题
            const header = document.createElement('div');
            header.style.cssText = "display:flex; justify-content:space-between; font-weight:bold; color:var(--accent); margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:8px;";
            header.innerHTML = `<span>${state.viewMode === 'tag' ? '🏷️' : '📁'} ${key}</span><span>￥${group.total.toLocaleString()}</span>`;
            groupCard.appendChild(header);

            // 3. 核心：遍历 group.items 渲染每一行
            group.items.forEach(r => {
                const row = document.createElement('div');
                row.className = "record-row";
                // 这里的 data-id 很重要，批量修改要用到
                row.setAttribute('data-id', r.id); 
                row.style.cssText = "display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #222; cursor:pointer; transition: background 0.2s;";

                // 找到 refreshData 里的这一段并替换
row.innerHTML = `
    <div class="batch-checkbox-container" style="display: ${state.isBatchMode ? 'block' : 'none'}; margin-right:12px;">
        <input type="checkbox" class="record-checkbox" ${state.selectedIds.includes(r.id) ? 'checked' : ''} onclick="event.stopPropagation()">
    </div>
    <div style="flex:1;">
        <div style="font-size:0.8em; color:var(--text-sec);">${r.record_date || '历史'}</div>
        <div style="color:#eee; font-size:0.95em;">${r.remark || '<span style="color:#444">无备注</span>'}</div>
    </div>
    <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
        <div style="font-weight:bold; color:${r.amount >= 0 ? 'var(--accent)' : 'var(--danger)'}">
            ￥${r.amount.toLocaleString()}
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:10px; color:#666;">
                ${state.viewMode === 'tag' ? r.category_path : (r.category_tag || '未分类')}
            </span>
            <span class="del-btn" 
                  style="font-size: 10px; padding: 1px 4px; border-color: #444; color: #666;" 
                  onclick="event.stopPropagation(); deleteRecord(${r.id})">
                删除
            </span>
        </div>
    </div>
`;

                // 4. 行点击事件逻辑切换
                row.onclick = () => {
                    if (state.isBatchMode) {
                        // 批量模式：点击行即勾选
                        const cb = row.querySelector('.record-checkbox');
                        cb.checked = !cb.checked;
                        handleRowSelect(r.id, cb.checked, row);
                    } else {
                        // 普通模式：点击行打开编辑弹窗
                        openEditModal(r);
                    }
                };
                
                groupCard.appendChild(row);
            });

            listContainer.appendChild(groupCard);
        });

        // 更新总金额
        const totalValEl = document.getElementById('total-val');
        if(totalValEl) totalValEl.innerText = `￥${totalBalance.toLocaleString()}`;

    } catch (err) {
        console.error(err);
        listContainer.innerHTML = '<div style="color:red">加载失败，请检查网络</div>';
    }
}

async function askAiAssistant() {
    const start = document.getElementById('ai-date-start').value;
    const end = document.getElementById('ai-date-end').value;
    const query = document.getElementById('user-query').value.trim();
    const history = document.getElementById('chat-history');

    if (!query) return;
    if (!start || !end) return alert("请先指定日期范围以便 AI 调取数据");

    // 1. UI 显示用户问题
    history.innerHTML += `<div style="align-self: flex-end; background:var(--accent); color:#000; padding:10px; border-radius:12px 12px 0 12px; font-size:0.9em; max-width:85%;">${query}</div>`;
    document.getElementById('user-query').value = '';
    history.scrollTop = history.scrollHeight;

    const loadingId = 'ai-loading-' + Date.now();
    history.innerHTML += `<div id="${loadingId}" style="align-self: flex-start; background:#2a2a2a; padding:10px; border-radius:0 12px 12px 12px; font-size:0.9em; max-width:85%;">正在思考...</div>`;

    try {
        // 2. 如果是本轮对话第一次提问，则加载数据
        if (!chatContext.recordsLoaded) {
            document.getElementById(loadingId).innerText = "正在调取账目数据并分析...";
            const { data: records } = await db.from('finance_records')
                .select('category_path, amount, remark, record_date')
                .eq('user_id', state.userId)
                .gte('record_date', `${start}T00:00:00`)
                .lte('record_date', `${end}T23:59:59`);
            
            chatContext.dataSummary = records.map(r => `[${r.record_date.slice(5,10)}] ${r.category_path}: ${r.amount} (${r.remark || ''})`).join('\n');
            chatContext.recordsLoaded = true;
            document.getElementById('data-status').innerText = `(已同步 ${records.length} 条记录)`;
        }

        // 3. 获取 AI 配置
        const { data: setRes } = await db.from('settings').select('data').eq('user_id', state.userId);
        const aiConfig = typeof setRes[0].data === 'string' ? JSON.parse(setRes[0].data) : setRes[0].data;

        // 4. 构建消息（只在第一条消息中包含原始数据，后续只带历史对话）
        if (chatContext.messages.length === 0) {
            chatContext.messages.push({ 
                role: "system", 
                content: `你是私人财务助理。这是用户从 ${start} 到 ${end} 的流水记录：\n${chatContext.dataSummary}\n请基于此数据回答后续问题。` 
            });
        }
        chatContext.messages.push({ role: "user", content: query });

        // 5. 调用 AI
        const response = await fetch(aiConfig.aiEndpoint, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${aiConfig.aiApiKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: aiConfig.aiModel,
                messages: chatContext.messages,
                temperature: 0.5
            })
        });

        const resData = await response.json();
        const aiMsg = resData.choices[0].message.content;
        
        // 保存 AI 回复到上下文
        chatContext.messages.push({ role: "assistant", content: aiMsg });
        document.getElementById(loadingId).innerText = aiMsg;

    } catch (err) {
        document.getElementById(loadingId).innerText = "❌ 错误: " + err.message;
    }
    history.scrollTop = history.scrollHeight;
}

let pendingUpdates = []; // 暂存 AI 建议的修改

async function startAiAutoCategory() {
    const start = document.getElementById('ai-date-start').value;
    const end = document.getElementById('ai-date-end').value;
    const history = document.getElementById('chat-history');

    if (!start || !end) return alert("请先选择要分类的时间段");

    history.innerHTML = `<div style="color:var(--accent); font-size:0.9em;">正在扫描 [${start}] 至 [${end}] 的流水...</div>`;
    
    try {
        // 1. 获取流水
        const { data: records } = await db.from('finance_records')
            .select('id, category_path, amount, remark, record_date')
            .eq('user_id', state.userId)
            .gte('record_date', `${start}T00:00:00`)
            .lte('record_date', `${end}T23:59:59`);

        if (!records || records.length === 0) {
            history.innerHTML += `<div>该时段无数据。</div>`;
            return;
        }

        // 2. 获取 AI 配置
        const { data: setRes } = await db.from('settings').select('data').eq('user_id', state.userId);
        const aiConfig = typeof setRes[0].data === 'string' ? JSON.parse(setRes[0].data) : setRes[0].data;

        // 3. 请求 AI 进行分类建议
        history.innerHTML += `<div style="color:#888; font-size:0.8em;">AI 正在根据备注拟定分类清单...</div>`;
        
        const prompt = `你是一个财务对账员。请根据以下流水，为每条记录输出一个简洁的二级分类（如：餐饮、交通、购物、娱乐、工资、投资、其他）。
        格式要求：只返回 JSON 数组，格式为 [{"id":记录ID, "suggested": "新分类名称"}]
        
        流水数据：\n${records.map(r => `ID:${r.id}, 路径:${r.category_path}, 金额:${r.amount}, 备注:${r.remark}`).join('\n')}`;

        const response = await fetch(aiConfig.aiEndpoint, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${aiConfig.aiApiKey}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: aiConfig.aiModel,
                messages: [{ role: "system", content: "你只负责输出纯JSON格式的分类建议。" }, { role: "user", content: prompt }],
                temperature: 0.2
            })
        });

        const resData = await response.json();
        const suggestions = JSON.parse(resData.choices[0].message.content);
        pendingUpdates = suggestions;

        // 4. 渲染预览界面
        let previewHtml = `<div style="background:#2a2a2a; padding:10px; border-radius:8px; margin-top:10px;">
            <b style="font-size:0.9em; color:var(--accent);">检查 AI 分类建议：</b><br><br>`;
        
        suggestions.forEach(s => {
            const original = records.find(r => r.id === s.id);
            previewHtml += `<div style="font-size:0.8em; margin-bottom:5px; border-bottom:1px solid #444; padding-bottom:3px;">
                <span style="color:#888;">${original.remark || '无备注'}</span> ➡️ <b style="color:#ffa940;">${s.suggested}</b> (￥${original.amount})
            </div>`;
        });

        previewHtml += `<button class="btn" style="margin-top:10px;" onclick="commitAiCategories()">确认并存入云端</button></div>`;
        history.innerHTML = previewHtml;

    } catch (err) {
        history.innerHTML = `<div style="color:var(--danger);">分析失败: ${err.message}</div>`;
    }
}

async function commitAiCategories() {
    if (!confirm(`确定要更新这 ${pendingUpdates.length} 条记录的分类吗？`)) return;

}

// 执行批量更新并上传到 Supabase
async function applyBatchUpdate() {
    const selectEl = document.getElementById('batch-new-tag');
    const newTag = selectEl.value;
    
    if (!newTag) return alert("请先选择一个目标分类！");
    if (state.selectedIds.length === 0) return alert("请先勾选记录！");
    if (!confirm(`确定将这 ${state.selectedIds.length} 条记录修改为 [${newTag}] 吗？`)) return;

    // 我们直接通过 ID 找面板，再找里面的 button
    const panel = document.getElementById('batch-panel');
    const btn = panel ? panel.querySelector('button[onclick^="applyBatchUpdate"]') : null;
    const originalText = btn ? btn.innerText : "确认上传修改";

    try {
        if (btn) {
            btn.innerText = "正在上传...";
            btn.disabled = true;
        }

        const { error } = await db.from('finance_records')
            .update({ category_tag: newTag })
            .in('id', state.selectedIds);

        if (error) throw error;

        alert(`✅ 成功！云端已更新 ${state.selectedIds.length} 条数据`);
        
        state.selectedIds = [];
        toggleBatchMode(); 
        await refreshData(); 
    } catch (err) {
        console.error("批量上传出错:", err);
        alert("上传失败: " + err.message);
    } finally {
        // --- 修改这里：恢复状态 ---
        if (btn) {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }
}

    window.onload = init;
</script>

</body>
</html>
